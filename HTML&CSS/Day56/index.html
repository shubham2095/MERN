<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <table border>
        <tr>
            <th>S.NO.</th>
            <th>Name</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Shubham</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Aditya</td>
        </tr>

    </table>

    <form method="post" action=" https://httpdump.app/dumps/797182a7-94ea-4a0f-81d1-8c477f1e8f14">

        <div>
            <label for="un">UserName</label>    
            <input  required id="un" name="username" placeholder="John Doe" type="text">
        </div>

        <div>
            <label for="ag">Age</label>
            <input required id="ag" name="age" type="date" max="2008-11-17">
        </div>

        <div>
            <label for="em">Email</label>    
            <input  required id="em" name="email" type="email">
        </div>

        <div>
            <label for="ps">Password</label>    
            <input  required id="ps" name="password" type="password">
        </div>

        <div>
            <label for="rn">Rating</label>
            <input id="rn" type="range" step="1" min="1" max="5">
        </div>

        <div>
            <p>Gender :</p>
            <div>
                <label for="male">Male</label>
                <input value="male" name="Gender" type="radio">
            </div>

            <div>
                <label for="female">Female</label>
                <input value="female" name="Gender" type="radio">
            </div>

            <div>
                <label for="others">Others</label>
                <input value="others" name="Gender" type="radio">
            </div>
        </div>

        <div>
            <select name="city" id="" required>
                <option disabled selected value="">Choose your City</option>
                <option value="del">Delhi</option>
                <option value="mum">Mumbai</option>
                <option value="ban">Banglore</option>
                <option value="pune">Pune</option>
            </select>
        </div>

        <div>
            <label for="cou">Course</label>
            <input list="mylist" id="cou" type="text" name="Course">
        </div>

        <datalist id="mylist">
             <option value="MERN"></option>
             <option value="JAVA"></option>
             <option value="DA"></option>
             <option value="DSA"></option>
        </datalist>

        <button type="submit">Submit</button>
        <br>
        <button type="reset">Reset Form</button>

    </form>

        
</body>
</html>
